# deploy/mirotalk/nginx-call.skilledproz.com.conf
#
# Nginx site config for call.skilledproz.com
#
# Copy this to /etc/nginx/sites-available/call.skilledproz.com on the VPS,
# then symlink into sites-enabled and reload Nginx.
#
# The SSL cert paths are populated by Certbot on first run:
#   certbot --nginx -d call.skilledproz.com

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name call.skilledproz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — proxy to MiroTalk on 127.0.0.1:3000 ──────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name call.skilledproz.com;

    ssl_certificate /etc/letsencrypt/live/call.skilledproz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.skilledproz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    client_max_body_size 20M;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_cache_bypass $http_upgrade;
    }
}